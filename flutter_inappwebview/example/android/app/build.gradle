plugins {
    id "com.android.application"
    // MainActivity is Kotlin. This app sets android.builtInKotlin=false globally (other plugins
    // still apply org.jetbrains.kotlin.android, which built-in Kotlin rejects), so Kotlin has to
    // be opted back in for this module -- the documented module-by-module migration path.
    id "com.android.built-in-kotlin"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace 'dev.nosferatu500.inappwebview.example'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Not flutter.compileSdkVersion (36 on Flutter 3.44): permission_handler 13
    // publishes AAR metadata requiring consumers to compile against API 37+.
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "dev.nosferatu500.inappwebview.example"
        minSdk = 30
        targetSdk = 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // only for dev.nosferatu500.inappwebview.R.menu.menu_main
            minifyEnabled = false
            shrinkResources = false

            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
    
    lint {
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

configurations.configureEach {
    resolutionStrategy {
        // The Flutter SDK's integration_test package requests
        // androidx.test.espresso:espresso-core:3.2+, which resolves to 3.2.0.
        // That release predates unique library namespaces, so AGP 9 rejects it
        // during manifest merging (android.uniquePackageNames defaults to true).
        // 3.6.x is API-compatible and declares a unique namespace.
        force 'androidx.test.espresso:espresso-core:3.6.1'
        force 'androidx.test.espresso:espresso-idling-resource:3.6.1'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'
}
