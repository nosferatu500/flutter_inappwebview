# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

# The `linter: rules:` block that used to live here set every value to `ignore`,
# which is only meaningful under `analyzer: errors:`. That made this file
# invalid, which silently disabled *all* flutter_lints rules and broke pub.dev's
# static analysis (upstream issue #2758).
#
# With the file valid again, flutter_lints surfaces pre-existing style
# violations across the whole codebase. They are opted out explicitly below so
# `flutter analyze` stays actionable; re-enable them one at a time (most are
# auto-fixable via `dart fix --apply`). Rules that catch real defects -- such as
# unrelated_type_equality_checks -- are deliberately left enabled.
linter:
  rules:
    # Opt-in: not in flutter_lints, and no longer an analyzer default (§227).
    deprecated_member_use_from_same_package: true
    non_constant_identifier_names: false
    # Opt-in: not in flutter_lints, which ships it off (§241).
    prefer_const_constructors: true
    # Opt-in: not in flutter_lints, which ships it off (§233).
    prefer_const_declarations: true
    # Opt-in: not in flutter_lints, which ships it off (§237).
    prefer_const_literals_to_create_immutables: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
analyzer:
  errors:
    constant_identifier_names: ignore
    deprecated_member_use: ignore
