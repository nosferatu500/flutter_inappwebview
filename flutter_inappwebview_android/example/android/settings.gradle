pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '9.3.1' apply false
    // The Kotlin Gradle Plugin, on the build classpath only: `apply false`, so no module applies it
    // from here. AGP 9.3.1 brings KGP 2.2.10, and Flutter 3.47's Gradle plugin refuses a KGP older
    // than 2.2.20 (and warns below 2.3.20); 2.4.0 is what Flutter 3.47.7's own app template
    // declares. Kotlin itself comes from AGP's built-in Kotlin (gradle.properties), which rejects
    // org.jetbrains.kotlin.android applied to a module.
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"