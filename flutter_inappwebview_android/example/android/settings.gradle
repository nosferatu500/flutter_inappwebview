pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '9.3.1' apply false
    // Resolved here so the :app module can opt back into Kotlin; see the comment there.
    id "com.android.built-in-kotlin" version '9.3.1' apply false
    // org.jetbrains.kotlin.android is intentionally absent: it is incompatible
    // with the AGP 9 DSL. Flutter's Gradle plugin applies KGP to the plugin
    // subprojects that need it (this app sets android.builtInKotlin=false, so
    // AGP's built-in Kotlin is off by default).
}

include ":app"