plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace 'dev.nosferatu500.inappwebview.android.example'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "dev.nosferatu500.inappwebview.android.example"
        // Must match the plugin's minSdk: AGP rejects an app below the floor of
        // a library it consumes.
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // only for dev.nosferatu500.inappwebview.R.menu.menu_main
            minifyEnabled = false
            shrinkResources = false

            // Signed with the debug keys, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
}
