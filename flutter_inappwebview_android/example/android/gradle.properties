org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Compile the plugin module with -Werror. Opt-in on purpose: the flag lives on the
# example projects (never published) rather than in the module's own build.gradle,
# so this repo's gates are strict while consuming apps are never broken by a
# warning a future Kotlin release introduces in our sources. See
# flutter_inappwebview_android/android/build.gradle.
inappwebview.strictKotlin=true
