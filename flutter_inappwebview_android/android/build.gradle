group = 'dev.nosferatu500.inappwebview'
version = '1.0-SNAPSHOT'

// No buildscript block: this module requires AGP 9 and is always built as a
// subproject of the consuming app, so it inherits AGP from the app's classpath.
// Pinning its own AGP version here would put a second, older AGP on the
// buildscript classpath.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'dev.nosferatu500.inappwebview'
    compileSdk = flutter.compileSdkVersion

    // This module's sources are Kotlin, so built-in Kotlin must stay on -- do not
    // reintroduce `enableKotlin = false`. Nothing else is needed here: whichever
    // Kotlin toolchain the consuming app ends up with compiles this module.
    //
    //   * app on AGP 9 defaults (android.builtInKotlin=true): AGP's built-in
    //     Kotlin is applied to every module, including this one.
    //   * app with android.builtInKotlin=false (still required whenever some
    //     other plugin applies org.jetbrains.kotlin.android, which built-in
    //     Kotlin rejects): Flutter's own Gradle plugin applies `kotlin-android`
    //     to every plugin subproject that applies AGP and does not already
    //     declare KGP -- see FlutterPluginUtils.kt. Both example apps here take
    //     this path.
    //
    // Declaring a Kotlin plugin explicitly would break one of those two cases:
    // `com.android.built-in-kotlin` is not on this module's classpath unless the
    // app resolves it, and applying KGP here fails under built-in Kotlin with
    // "Cannot add extension with name 'kotlin'".

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 30
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
        // Shipped to consumers in the AAR; this is the only shrinker
        // configuration a library should declare. Applying R8 to the library
        // itself (buildTypes { release { minifyEnabled true } }) is wrong for a
        // Flutter plugin and pulled in getDefaultProguardFile(), which AGP 9
        // rejects for 'proguard-android.txt'.
        consumerProguardFiles 'proguard-rules.pro'
    }

    lint {
        disable 'InvalidPackage'
    }
}

// Kotlin defaults its jvmTarget to the Gradle JVM, which leaves it inconsistent
// with the 17 set in compileOptions above ("Inconsistent JVM-target
// compatibility detected"). Set it on the compile tasks rather than through a
// DSL block: the `android { kotlinOptions { } }` extension only exists under
// KGP, and this module is also built under AGP's built-in Kotlin, which does not
// provide it. Task names are the same either way.
tasks.matching { it.name ==~ /compile.*Kotlin/ }.configureEach {
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17

    // This module's Kotlin warning baseline is zero and is meant to stay there.
    // `allWarningsAsErrors = true` unconditionally would be the wrong way to hold
    // it: this module is compiled inside the *consuming app's* build, so a future
    // Kotlin release that introduces a new warning in our sources would break
    // THEIR build, over a warning they cannot fix and did not write.
    //
    // So it is opt-in, and both example projects opt in via their own
    // gradle.properties -- which are not published. Every gate in this repo
    // therefore compiles strict, and no consumer ever does.
    compilerOptions.allWarningsAsErrors.set(
            providers.gradleProperty('inappwebview.strictKotlin')
                    .map { it == 'true' }
                    .orElse(false)
    )
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // JVM unit tests (src/test). These never reach a consumer: `testImplementation`
    // is not part of the published AAR's POM.
    //
    // JUnit 4, not 5: AGP wires 4 up for `testDebugUnitTest` with no extra plugin,
    // and this module cannot casually add Gradle plugins (see the note above).
    testImplementation 'junit:junit:4.13.2'
    // A real org.json. Unit tests otherwise link against the stub in android.jar,
    // where every method throws "Stub!", which would make Util.JSONStringify
    // untestable. AGP puts android.jar last on the unit-test classpath, so this
    // wins. Deliberately NOT `testOptions.unitTests.returnDefaultValues = true`:
    // that turns every unmocked framework call into a silent 0/null and would hide
    // exactly the kind of bug these tests exist to catch.
    testImplementation 'org.json:json:20250107'
}
