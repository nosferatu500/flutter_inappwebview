name: flutter_inappwebview_android
description: Android implementation of the flutter_inappwebview plugin.
version: 1.2.0-beta.3
homepage: https://inappwebview.dev/
repository: https://github.com/pichillilorenzo/flutter_inappwebview/tree/master/flutter_inappwebview_android
issue_tracker: https://github.com/pichillilorenzo/flutter_inappwebview/issues
funding:
  - https://inappwebview.dev/donate/
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3
    # path: ../flutter_inappwebview_platform_interface
  # Required by the Pigeon-generated lib/src/pigeons/*.g.dart, which import
  # `package:meta/meta.dart` for `immutable` / `protected` / `visibleForTesting`. Without it
  # `flutter pub publish` REFUSES this package (exit 65) — pub treats an undeclared import from
  # lib/ as an error, and no other gate in this repo can see it. Deliberately a loose lower bound:
  # those three annotations have been in meta for years, while the Flutter SDK pins meta to an
  # *exact* version (1.18.0 on 3.44.9), so a tight bound here would risk conflicting with whatever
  # a given Flutter release happens to pin.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  # Generates the typed Dart<->Kotlin transport in lib/src/pigeons/ and
  # android/.../pigeons/. Schemas live in pigeons/; regenerate with
  # `dart run pigeon --input pigeons/<name>.dart`. Dev-only: the generated code has
  # no dependency on pigeon itself, so consumers never resolve it.
  pigeon: ^27.3.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    implements: flutter_inappwebview
    platforms:
      android:
        package: dev.nosferatu500.inappwebview
        pluginClass: InAppWebViewFlutterPlugin
        dartPluginClass: AndroidInAppWebViewPlatform

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages

# Local development overrides. Without these each package resolves
# flutter_inappwebview_platform_interface from pub.dev, so local API changes are
# invisible to its siblings. pub ignores dependency_overrides in consuming
# projects, so this affects this repo only.
dependency_overrides:
  flutter_inappwebview_platform_interface:
    path: ../flutter_inappwebview_platform_interface
